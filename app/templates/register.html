{% extends "base.html" %}
{% block title %}Create account · {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-panel">
  <p class="eyebrow">A quiet place to write</p>
  <h1>Create your account.</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <label>Name<input type="text" name="display_name" maxlength="80" autocomplete="name"></label>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="primary-button" type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a>.</p>
</section>
{% endblock %}
