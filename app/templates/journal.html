{% extends "base.html" %}
{% block title %}{% if journal.title %}{{ journal.title }}{% else %}Journal{% endif %} · {{ app_name }}{% endblock %}
{% block content %}
<section class="editor-panel">
  <a class="back-link" href="/">← Recent journals</a>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" class="journal-editor" data-autosave-url="/journals/{{ journal.id }}/autosave">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <label class="sr-only" for="title">Title</label>
    <input id="title" name="title" value="{{ journal.title }}" placeholder="Title (optional)" maxlength="200">
    <label class="sr-only" for="content">Content</label>
    <textarea id="content" name="content" rows="18" maxlength="100000" autofocus>{{ journal.content }}</textarea>
    <label for="tag_names">Tags <span class="muted">(comma-separated, up to 10)</span></label>
    <input id="tag_names" name="tag_names" value="{{ tag_names }}" maxlength="800" placeholder="work, ideas">
    <input type="hidden" name="version" value="{{ journal.version }}">
    <div class="editor-actions">
      <span class="muted" data-save-status aria-live="polite">Saved</span>
      <button class="primary-button" type="submit">Save changes</button>
    </div>
  </form>
  <form method="post" action="/journals/{{ journal.id }}/delete" class="delete-form">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button class="text-button danger-button" type="submit">Move to trash</button>
  </form>
</section>
{% endblock %}
